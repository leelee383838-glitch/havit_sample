  <div class="page-hero">
    <h1>회원가입</h1>
    <p>아이디, 이름, 연락처, 이메일을 입력하고 가입하거나 카카오로 빠르게 가입할 수 있습니다.</p>
  </div>

  <article class="article">
    <div class="wrap">
      <form id="register-form" class="form-panel form-panel--wide form-panel--center">
        <div class="form-stack">
          <div>
            <label class="form-label" for="reg-userid">아이디</label>
            <input class="form-input" type="text" id="reg-userid" name="userid" required maxlength="50" autocomplete="username" />
          </div>
          <div>
            <label class="form-label" for="reg-password">비밀번호 (6자 이상)</label>
            <input class="form-input" type="password" id="reg-password" name="password" required minlength="6" autocomplete="new-password" />
          </div>
          <div>
            <label class="form-label" for="reg-password2">비밀번호 확인</label>
            <input class="form-input" type="password" id="reg-password2" name="password2" required minlength="6" autocomplete="new-password" />
          </div>
          <div>
            <label class="form-label" for="reg-name">이름</label>
            <input class="form-input" type="text" id="reg-name" name="name" required maxlength="100" autocomplete="name" />
          </div>
          <div>
            <label class="form-label" for="reg-phone">연락처</label>
            <input class="form-input" type="tel" id="reg-phone" name="phone" maxlength="30" autocomplete="tel" placeholder="010-0000-0000" />
          </div>
          <div>
            <label class="form-label" for="reg-email">이메일</label>
            <input class="form-input" type="email" id="reg-email" name="email" maxlength="255" autocomplete="email" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary">가입하기</button>
            <a class="btn btn--ghost" href="login.html">로그인</a>
          </div>
          <div>
            <p class="form-hint" id="kakao-key-hint"></p>
            <button type="button" class="btn btn--kakao" id="kakao-login-btn">카카오로 빠른 가입</button>
          </div>
        </div>
      </form>
    </div>
  </article>
